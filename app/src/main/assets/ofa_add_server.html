<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Server</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1976d2; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:disabled { background: #ccc; }
        .error { color: red; font-size: 14px; margin-top: 5px; display: none; }
    </style>
</head>
<body>
    <h2>Tambah Server Baru</h2>
    <div class="form-group">
        <label>Nama Server *</label>
        <input type="text" id="name" placeholder="Masukkan nama server">
    </div>
    <div class="form-group">
        <label>Alamat Host *</label>
        <input type="text" id="host" placeholder="server.example.com">
    </div>
    <div class="form-group">
        <label>Port</label>
        <input type="number" id="port" value="64738">
    </div>
    <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Opsional">
    </div>
    <p class="error" id="errorMsg"></p>
    <button id="saveBtn" onclick="saveServer()">Simpan Server</button>

    <script>
        // Data standby: tidak dikirim ke Java sampai tombol diklik
        let preFillData = window.preFillData || {};
        
        function initForm() {
            if (preFillData.host) document.getElementById('host').value = preFillData.host;
            if (preFillData.port) document.getElementById('port').value = preFillData.port;
        }
        
        function saveServer() {
            const name = document.getElementById('name').value.trim();
            const host = document.getElementById('host').value.trim();
            const port = parseInt(document.getElementById('port').value) || 64738;
            const username = document.getElementById('username').value.trim();
            
            if (!name || !host) {
                document.getElementById('errorMsg').textContent = 'Nama dan Host wajib diisi!';
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }
            
            // ✅ HANYA DI SINI DATA DIKIRIM KE JAVA
            const data = JSON.stringify({ name, host, port, username });
            MumlaBridge.handleSaveAddServer(data);
        }
        
        function onSaveSuccess() {
            // Kembali ke mode list setelah save sukses
            window.location.href = 'file:///android_asset/ofa_tirai_bambu.html';
        }
        
        function onSaveFailed(error) {
            document.getElementById('errorMsg').textContent = error;
            document.getElementById('errorMsg').style.display = 'block';
        }
        
        // Init form saat load
        window.onload = initForm;
    </script>
</body>
</html>
