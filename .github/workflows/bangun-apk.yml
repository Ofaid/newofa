name: Bangun OFA-PTT
run-name: Bangun OFA-PTT

on:
  push:
    branches:
      - ptt-new
  pull_request:
    branches:
      - ptt-new
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04   # ✅ Pakai versi yang stabil
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Bersihkan
        run: |
          rm -rf ~/.gradle/caches
          ./gradlew clean --no-daemon || true

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # ✅ Pakai alat yang sudah ada — TIDAK PERLU UPDATE APA-APA
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: "34.0.0"

      - name: Lokasi SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Izin
        run: chmod +x gradlew libraries/humla/gradlew

      - name: Bangun SpongyCastle
        run: |
          cd libraries/humla/libs/humla-spongycastle
          ../../../../gradlew jar
          cd ../../../../

      - name: Bangun APK Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Tampilkan lokasi APK
        run: find . -name "*-debug.apk" -type f

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: OFA-PTT-DEBUG
          path: "**/*-debug.apk"
          if-no-files-found: error
