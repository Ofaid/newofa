name: Bangun Mumla
run-name: Bangun Mumla

on:
  push:
    branches:
      - ptt-new
  pull_request:
    branches:
      - ptt-new
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Info perubahan
        run: |
          echo "Pengirim: ${{ github.actor }}"
          echo "Pesan: ${{ github.event.head_commit.message }}"
          echo "Cabang: ${{ github.ref_name }}"
          echo "Komit: ${{ github.sha }}"

      - name: Ambil kode & submodul
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Bersihkan cache
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper
          ./gradlew clean --no-daemon || true

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # ✅ KEMBALI KE CARA ASLI — biarkan alat bekerja sendiri
      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      # ✅ Cek jalur mana yang ada, pakai yang benar
      - name: Cek & Pasang NDK
        run: |
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            SDK_BIN="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin" ]; then
            SDK_BIN="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin"
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/12.0/bin" ]; then
            SDK_BIN="$ANDROID_SDK_ROOT/cmdline-tools/12.0/bin"
          else
            echo "Tidak ketemu jalur sdkmanager!"
            ls -la "$ANDROID_SDK_ROOT/cmdline-tools/"
            exit 1
          fi
          
          echo "Menggunakan: $SDK_BIN"
          $SDK_BIN/sdkmanager --install "ndk;25.1.8937393"
          echo "SDK_BIN=$SDK_BIN" >> $GITHUB_ENV

      - name: Tulis lokasi SDK & NDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> local.properties

      - name: Beri izin Gradle
        run: chmod +x gradlew libraries/humla/gradlew

      - name: Bangun SpongyCastle
        run: |
          cd libraries/humla/libs/humla-spongycastle
          ../../../../gradlew jar
          cd ../../../../

      - name: Bangun APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Ofaid-APK
          path: "**/*.apk"
