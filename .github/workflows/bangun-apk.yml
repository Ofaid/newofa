name: Bangun Mumla
run-name: Bangun Mumla

on:
  push:
    branches:
      - ptt-new
  pull_request:
    branches:
      - ptt-new
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Info perubahan
        run: |
          echo "Pengirim: ${{ github.actor }}"
          echo "Pesan: ${{ github.event.head_commit.message }}"
          echo "Cabang: ${{ github.ref_name }}"
          echo "Komit: ${{ github.sha }}"

      - name: Ambil kode & submodul
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Bersihkan cache
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper
          ./gradlew clean --no-daemon || true

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # ✅ Pasang alat SDK dengan perintah yang diperbaiki
      - name: Pasang Android SDK Tools
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          
          # Unduh dari alamat resmi
          wget -O tools.zip https://dl.google.com/android/repository/commandlinetools-linux-12667192_latest.zip
          
          # Periksa apakah unduhan berhasil
          if [ ! -f tools.zip ]; then
            echo "Gagal mengunduh alat!"
            exit 1
          fi
          
          unzip -q tools.zip
          rm tools.zip
          
          # Sesuaikan nama folder agar dikenali
          if [ -d cmdline-tools ]; then
            mv cmdline-tools latest
          fi
          
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        shell: bash

      - name: Pasang NDK
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"

      - name: Tulis lokasi SDK & NDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> local.properties

      - name: Beri izin Gradle
        run: chmod +x gradlew libraries/humla/gradlew

      - name: Bangun SpongyCastle
        run: |
          cd libraries/humla/libs/humla-spongycastle
          ../../../../gradlew jar
          cd ../../../../

      - name: Bangun APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Ofaid-APK
          path: "**/*.apk"
