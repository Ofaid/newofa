name: Bangun Mumla
run-name: Bangun Mumla

on:
  push:
    branches:
      - ptt-new
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
      SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
      SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
      KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Pasang Android SDK & NDK
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          
          # Hapus NDK bawaan runner yang konflik
          rm -rf "$SDK_DIR/ndk/25.2.9519653"
          rm -rf "$SDK_DIR/ndk-bundle"
          
          mkdir -p "$SDK_DIR/cmdline-tools"
          cd "$SDK_DIR/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          rm tools.zip
          mv cmdline-tools latest
          
          # Install NDK versi 25.1.8937393 sesuai permintaan project
          ./latest/bin/sdkmanager --install "ndk;25.1.8937393"
          
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "NDK_PATH=$SDK_DIR/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Buat local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$NDK_PATH" >> local.properties

      - name: Siapkan Tanda Tangan (Signing)
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_CONTENT }}
        run: |
          set -euo pipefail
          
          # 1. Decode keystore
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "${GITHUB_WORKSPACE}/ofaid_ptt_key.jks"
          
          # 2. Validasi file ada dan tidak kosong
          test -s "${GITHUB_WORKSPACE}/ofaid_ptt_key.jks" || { 
            echo "❌ Keystore file kosong atau tidak ada"; exit 1; 
          }
          
          # 3. Validasi password & alias menggunakan keytool
          echo "🔍 Memvalidasi keystore..."
          keytool -list \
            -keystore "${GITHUB_WORKSPACE}/ofaid_ptt_key.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1 || {
              echo "❌ VALIDASI GAGAL!"
              echo "   - Password keystore salah, ATAU"
              echo "   - Alias '$KEY_ALIAS' tidak ditemukan, ATAU"
              echo "   - File keystore rusak/korup"
              echo ""
              echo "💡 Silakan cek ulang secrets di GitHub Settings → Secrets and variables → Actions"
              exit 1
            }
          echo "✅ Keystore valid! Alias '$KEY_ALIAS' ditemukan."
          
          # 4. Buat signing.gradle dinamis
          cat > signing.gradle << EOF
          android {
              signingConfigs {
                  release {
                      storeFile file("${GITHUB_WORKSPACE}/ofaid_ptt_key.jks")
                      storePassword System.getenv("SIGN_STORE_PASSWORD")
                      keyAlias System.getenv("SIGN_KEY_ALIAS")
                      keyPassword System.getenv("SIGN_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          echo "✅ Signing files ready"

      - name: Izin Gradle
        run: chmod +x gradlew libraries/humla/gradlew

      - name: Bangun SpongyCastle (Library Native)
        run: |
          cd libraries/humla/libs/humla-spongycastle
          ../../../../gradlew jar --no-daemon
          cd ../../../../

      - name: Bangun APK RILIS
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/ofaid_ptt_key.jks \
            -Pandroid.injected.signing.store.password="$SIGN_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SIGN_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGN_KEY_PASSWORD" \
            --stacktrace --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: OFAID-RILIS-SIGNED
          path: "**/*release*.apk"
